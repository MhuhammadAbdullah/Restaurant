services:
  - type: web
    name: restaurant-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: .
    buildCommand: npm install -g pnpm@11.22.0 && pnpm install --frozen-lockfile && pnpm --filter @restaurant/database run generate && pnpm turbo run build --filter=@restaurant/api...
    startCommand: node services/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYFAST_MODE
        value: live
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_SECURED_KEY
        sync: false
      - key: PAYFAST_MERCHANT_NAME
        sync: false
      - key: PAYFAST_LIVE_API_BASE_URL
        value: https://ipguat.apps.net.pk/Ecommerce/api/Transaction
      - key: PAYFAST_LIVE_BRIDGE_BASE_URL
        sync: false
      - key: PAYFAST_LIVE_BROWSER_BRIDGE_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
